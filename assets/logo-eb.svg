<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="EB Hochdruckreinigung Logo">
  <defs>
    <linearGradient id="logoBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9fd8"/>
      <stop offset="1" stop-color="#0a4a7a"/>
    </linearGradient>
    <linearGradient id="logoSpray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6fd"/>
      <stop offset="1" stop-color="#bfe6f7"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="58" fill="url(#logoBlue)"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#eaf6fd" stroke-width="1.5" opacity="0.35"/>

  <!-- clean paving strip at the base -->
  <g clip-path="url(#clip)">
    <clipPath id="clip"><circle cx="60" cy="60" r="52"/></clipPath>
    <rect x="8" y="86" width="104" height="30" fill="#eaf6fd" opacity="0.16"/>
    <g stroke="#eaf6fd" stroke-width="1" opacity="0.3">
      <line x1="8" y1="96" x2="112" y2="96"/>
      <line x1="8" y1="106" x2="112" y2="106"/>
      <line x1="26" y1="86" x2="26" y2="116"/>
      <line x1="50" y1="86" x2="50" y2="116"/>
      <line x1="74" y1="86" x2="74" y2="116"/>
      <line x1="98" y1="86" x2="98" y2="116"/>
    </g>
  </g>

  <!-- spray nozzle wand -->
  <g transform="translate(30,34) rotate(-18)">
    <rect x="0" y="0" width="34" height="9" rx="4" fill="#f6a93b"/>
    <rect x="30" y="1.6" width="14" height="5.8" rx="2.6" fill="#e08e1c"/>
  </g>

  <!-- spray fan -->
  <path d="M62 38 L100 26 L96 34 L100 40 L92 40 L94 46 L84 42 L86 50 L74 44 Z" fill="url(#logoSpray)" opacity="0.9"/>

  <!-- droplets -->
  <circle cx="88" cy="60" r="3.2" fill="#eaf6fd" opacity="0.85"/>
  <circle cx="78" cy="70" r="2.2" fill="#eaf6fd" opacity="0.7"/>
  <circle cx="94" cy="72" r="1.8" fill="#eaf6fd" opacity="0.6"/>
</svg>
