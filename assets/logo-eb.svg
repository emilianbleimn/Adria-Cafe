<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 120" role="img" aria-label="EB Hochdruckreinigung Maskottchen">
  <ellipse cx="52" cy="106" rx="40" ry="7" fill="#d9e6ec"/>

  <!-- wheels -->
  <circle cx="33" cy="98" r="9" fill="#0a4a7a"/>
  <circle cx="33" cy="98" r="3.2" fill="#eaf6fd"/>
  <circle cx="61" cy="98" r="9" fill="#0a4a7a"/>
  <circle cx="61" cy="98" r="3.2" fill="#eaf6fd"/>

  <!-- handle -->
  <path d="M34 30 V20 a10 10 0 0 1 10-10 h4 a10 10 0 0 1 10 10 v10"
        fill="none" stroke="#0a4a7a" stroke-width="6" stroke-linecap="round"/>

  <!-- body -->
  <rect x="13" y="30" width="70" height="62" rx="16" fill="#7fd0ef" stroke="#0a4a7a" stroke-width="4"/>

  <!-- face plate -->
  <rect x="23" y="42" width="50" height="36" rx="8" fill="#ffffff" stroke="#bfe0f0" stroke-width="2"/>

  <!-- gauge dial -->
  <circle cx="37" cy="58" r="8" fill="#ffffff" stroke="#0a4a7a" stroke-width="2.4"/>
  <line x1="37" y1="58" x2="41" y2="53" stroke="#0a4a7a" stroke-width="2" stroke-linecap="round"/>

  <!-- status dots -->
  <circle cx="57" cy="53" r="3" fill="#2f9fd8"/>
  <circle cx="65" cy="53" r="3" fill="#f6a93b"/>

  <!-- detail lines -->
  <line x1="51" y1="64" x2="67" y2="64" stroke="#bfe0f0" stroke-width="3" stroke-linecap="round"/>
  <line x1="51" y1="71" x2="63" y2="71" stroke="#bfe0f0" stroke-width="3" stroke-linecap="round"/>

  <!-- arm to nozzle -->
  <circle cx="83" cy="50" r="7" fill="#0a4a7a"/>
  <path d="M83 50 C 99 46, 107 42, 117 36" fill="none" stroke="#0f6fb0" stroke-width="9" stroke-linecap="round"/>
  <g transform="translate(117,36) rotate(-24)">
    <rect x="0" y="-4" width="16" height="8" rx="3" fill="#0a4a7a"/>
  </g>

  <!-- spray sparkle -->
  <g stroke="#2f9fd8" stroke-width="2" stroke-linecap="round">
    <line x1="133" y1="16" x2="133" y2="24"/>
    <line x1="125" y1="22" x2="131" y2="25"/>
    <line x1="137" y1="20" x2="133" y2="25"/>
  </g>
  <circle cx="139" cy="30" r="2" fill="#2f9fd8"/>
  <circle cx="143" cy="36" r="1.5" fill="#7fd0ef"/>
</svg>
