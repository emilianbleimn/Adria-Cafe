<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 128" role="img" aria-label="Eiscafé Adria – Segelschiff im Oval">
  <defs>
    <clipPath id="adriaOval"><ellipse cx="52" cy="58" rx="40" ry="48"/></clipPath>
    <linearGradient id="adriaSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf1f3"/>
      <stop offset="1" stop-color="#cde0e8"/>
    </linearGradient>
    <linearGradient id="adriaSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f86a8"/>
      <stop offset="1" stop-color="#1d597c"/>
    </linearGradient>
    <linearGradient id="adriaSail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#e7d9bd"/>
    </linearGradient>
  </defs>

  <!-- brass frame -->
  <ellipse cx="52" cy="58" rx="46" ry="54" fill="#f6efe0" stroke="#b7965a" stroke-width="2.4"/>
  <ellipse cx="52" cy="58" rx="41.5" ry="49.5" fill="none" stroke="#b7965a" stroke-width="1" opacity="0.6"/>

  <g clip-path="url(#adriaOval)">
    <!-- sky & sun -->
    <rect x="10" y="8" width="84" height="100" fill="url(#adriaSky)"/>
    <circle cx="79" cy="27" r="10" fill="#f4e9cd" opacity="0.7"/>

    <!-- sea base -->
    <path d="M10 73 Q31 67 52 73 T94 73 L94 108 L10 108 Z" fill="url(#adriaSea)"/>

    <!-- ship -->
    <g>
      <!-- masts -->
      <g stroke="#6b4a2e" stroke-width="1.6" stroke-linecap="round">
        <line x1="40" y1="68" x2="40" y2="34"/>
        <line x1="52" y1="70" x2="52" y2="24"/>
        <line x1="64" y1="68" x2="64" y2="34"/>
      </g>
      <!-- pennants -->
      <path d="M52 24 l11 3 -11 3 z" fill="#7c2433"/>
      <path d="M40 34 l8 2.4 -8 2.4 z" fill="#7c2433"/>
      <path d="M64 34 l8 2.4 -8 2.4 z" fill="#7c2433"/>

      <!-- sails (back to front) -->
      <path d="M64 41 Q75 51 64 63 Z" fill="url(#adriaSail)" stroke="#c9b386" stroke-width="0.8"/>
      <path d="M40 41 Q52 51 40 63 Z" fill="url(#adriaSail)" stroke="#c9b386" stroke-width="0.8"/>
      <path d="M52 29 Q64 37 52 45 Z" fill="url(#adriaSail)" stroke="#c9b386" stroke-width="0.8"/>
      <path d="M52 47 Q70 58 52 69 Z" fill="url(#adriaSail)" stroke="#c9b386" stroke-width="0.8"/>
      <g stroke="#d9c8a4" stroke-width="0.6" fill="none" opacity="0.85">
        <path d="M52 50 Q63 58 52 66"/>
        <path d="M40 44 Q48 51 40 60"/>
        <path d="M64 44 Q72 51 64 60"/>
      </g>

      <!-- hull -->
      <path d="M29 66 L75 66 Q69 81 52 81 Q35 81 29 66 Z" fill="#7c3b2c"/>
      <path d="M30 67 L74 67" stroke="#d8b88a" stroke-width="1.3"/>
      <g fill="#e9c98f"><circle cx="40" cy="71" r="1"/><circle cx="47" cy="72" r="1"/><circle cx="57" cy="72" r="1"/><circle cx="64" cy="71" r="1"/></g>
    </g>

    <!-- foreground wave crests -->
    <g fill="none" stroke="#cfe7ef" stroke-linecap="round">
      <path d="M26 78 Q40 73 54 78 T92 77" stroke-width="1.4" opacity="0.7"/>
      <path d="M14 86 Q34 80 54 86 T96 85" stroke-width="1.1" opacity="0.5"/>
      <path d="M18 95 Q36 90 54 95 T94 94" stroke-width="1" opacity="0.35"/>
    </g>
  </g>
</svg>
